name: Build Docker image
description: >-
  Build a connector runtime Docker image, load it into the local Docker daemon
  and run a Trivy vulnerability scan against it (failing on HIGH/CRITICAL), so
  that every image built in this repository is always scanned. Exposes the
  image tags, labels and primary reference for later steps (SBOM, pushing).

inputs:
  runtime:
    description: the runtime name
    required: true
  image-title:
    description: the image title
    required: true
  image-description:
    description: the image description
    required: true

outputs:
  image-ref:
    description: The full reference (including tag) of the built image.
    value: ghcr.io/${{ steps.repo.outputs.lowercase }}/${{ inputs.runtime }}:${{ steps.meta.outputs.version }}
  tags:
    description: The Docker tags generated for the image.
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: The Docker labels generated for the image.
    value: ${{ steps.meta.outputs.labels }}

runs:
  using: "composite"
  steps:
    - name: Lowercase repository name
      id: repo
      uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
      with:
        string: ${{ github.repository }}

    - name: Generate Docker metadata for ${{ inputs.runtime }}
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ghcr.io/${{ steps.repo.outputs.lowercase }}/${{ inputs.runtime }}
        labels: |
          org.opencontainers.image.title=${{ inputs.image-title }}
          org.opencontainers.image.description=${{ inputs.image-description }}
        tags: |
          type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build ${{ inputs.runtime }}
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ./launchers
        file: launchers/Dockerfile
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          RUNTIME=${{ inputs.runtime }}

    - name: Trivy scan ${{ inputs.runtime }}
      uses: Mobility-Data-Space/.github/actions/trivy-image-scan@main
      with:
        image-ref: ghcr.io/${{ steps.repo.outputs.lowercase }}/${{ inputs.runtime }}:${{ steps.meta.outputs.version }}
        report-name: trivy-${{ inputs.runtime }}
        output-file: trivy-${{ inputs.runtime }}.txt
