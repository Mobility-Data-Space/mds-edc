name: Build and Publish Docker images

inputs:
  runtime:
    description: the runtime name
    required: true
  image-title:
    description: the image title
    required: true
  image-description:
    description: the image description
    required: true

runs:
  using: "composite"
  steps:
    - name: Build ${{ inputs.runtime }}
      id: build
      uses: ./.github/actions/build-docker-image
      with:
        runtime: ${{ inputs.runtime }}
        image-title: ${{ inputs.image-title }}
        image-description: ${{ inputs.image-description }}

    - name: Generate SBOM for ${{ inputs.runtime }}
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ steps.build.outputs.image-ref }}
        artifact-name: sbom-${{ inputs.runtime }}
        output-file: sbom-${{ inputs.runtime }}.spdx.json

    - name: Push ${{ inputs.runtime }}
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ./launchers
        file: launchers/Dockerfile
        push: true
        tags: ${{ steps.build.outputs.tags }}
        labels: ${{ steps.build.outputs.labels }}
        build-args: |
          RUNTIME=${{ inputs.runtime }}
