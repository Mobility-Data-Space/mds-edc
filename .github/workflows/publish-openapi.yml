name: Build and Publish openapi specs to GH pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - "*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Mobility-Data-Space/.github/actions/setup-java@main

      - name: Generate extensions OpenApi specs
        run: | 
          ./gradlew resolve
          ./gradlew openApiGenerate
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}

      - run: |
          if [[ "${{ github.ref.type }}" == "tag" ]]; then
            version=${{ github.ref_name }}
          else
            version=latest  
          fi
          
          launchers=($(cd launchers && ls */ -d | grep -v "base-connector"))

          specs=()
          for launcher in "${launchers[@]}"
          do
            name=${launcher%/}
            mkdir -p public/openapi/${name}/latest && cp launchers/${name}/build/generated/openapi/openapi.yaml "$_"
            specs+=("\"${name}\"")
          done

          # manifest consumed by the swagger-ui landing page to populate the spec selector
          printf '[%s]' "$(IFS=,; echo "${specs[*]}")" > public/openapi/index.json

          # swagger-ui landing page served at the GitHub Pages root
          cp resources/swagger-ui/index.html public/index.html

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
