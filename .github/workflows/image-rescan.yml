name: Periodic Image Rescan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  rescan:
    permissions:
      contents: read
      packages: read
    uses: Mobility-Data-Space/.github/.github/workflows/image-rescan.yml@main
    with:
      tag-source: release
      images: >-
        [
          "mobility-data-space/mds-edc/connector-inmemory",
          "mobility-data-space/mds-edc/connector-inmemory-dcp",
          "mobility-data-space/mds-edc/connector-vault-postgresql",
          "mobility-data-space/mds-edc/connector-vault-postgresql-dcp",
          "mobility-data-space/mds-edc/wallet"
        ]
