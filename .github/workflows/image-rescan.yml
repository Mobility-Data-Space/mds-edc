name: Periodic Image Rescan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  fetch-tags:
    name: Fetch last 3 released tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Get last 3 released image tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh api \
            "/repos/${{ github.repository }}/releases?per_page=20" \
            --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name | ltrimstr("v") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0:3]')
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

  rescan:
    name: Scan ${{ matrix.image }}:${{ matrix.tag }}
    needs: fetch-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - connector-inmemory
          - connector-inmemory-dcp
          - connector-vault-postgresql
          - connector-vault-postgresql-dcp
          - wallet
        tag: ${{ fromJson(needs.fetch-tags.outputs.tags) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ github.repository }}

      - name: Trivy image scan ${{ matrix.image }}:${{ matrix.tag }}
        uses: Mobility-Data-Space/.github/actions/trivy-image-scan@main
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.lowercase }}/${{ matrix.image }}:${{ matrix.tag }}
          report-name: trivy-rescan-${{ matrix.image }}-${{ matrix.tag }}
          output-file: trivy-rescan-${{ matrix.image }}-${{ matrix.tag }}.txt
