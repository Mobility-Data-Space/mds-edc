name: verify pull request

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        target: [build, daps, dcp, tck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Mobility-Data-Space/.github/actions/setup-java@main

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: gradle ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" == "build" ]; then
            ./gradlew build
          else
            ./gradlew slowTests -Ptags=${{ matrix.target }}
          fi
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}

  filesystem-scan:
    name: Trivy Filesystem & Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Gradle lockfiles
        shell: bash
        run: ./gradlew resolveAndLockAll --write-locks
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}

      - uses: Mobility-Data-Space/.github/actions/trivy-fs-scan@main

  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - connector-inmemory
          - connector-inmemory-dcp
          - connector-vault-postgresql
          - connector-vault-postgresql-dcp
          - wallet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: Mobility-Data-Space/.github/actions/setup-java@main

      - name: Build
        run: ./gradlew :launchers:${{ matrix.runtime }}:build -x test -x slowTests
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}

      - name: Build and scan ${{ matrix.runtime }} image
        uses: ./.github/actions/build-docker-image
        with:
          runtime: ${{ matrix.runtime }}
          image-title: ${{ matrix.runtime }}
          image-description: ${{ matrix.runtime }}
