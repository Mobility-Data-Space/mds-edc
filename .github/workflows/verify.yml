name: verify pull request

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        target: [build, daps, dcp, tck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-jdk

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: gradle ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" == "build" ]; then
            ./gradlew build
          else
            ./gradlew slowTests -Ptags=${{ matrix.target }}
          fi
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}

