name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filesystem-scan:
    name: Trivy Filesystem & Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-jdk

      - name: Generate Gradle lockfiles
        run: ./gradlew resolveAndLockAll --write-locks
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}

      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-fs.txt
          severity: MEDIUM,HIGH,CRITICAL
          scanners: vuln,secret

      - name: Upload scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-fs
          path: trivy-fs.txt

      - name: Fail on HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          scanners: vuln,secret

  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - connector-inmemory
          - connector-inmemory-dcp
          - connector-vault-postgresql
          - connector-vault-postgresql-dcp
          - wallet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-jdk

      - name: Build
        run: ./gradlew :launchers:${{ matrix.runtime }}:build -x test -x slowTests
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ github.token }}

      - uses: ./.github/actions/publish-docker-image
        with:
          runtime: ${{ matrix.runtime }}
          image-title: ${{ matrix.runtime }}
          image-description: ${{ matrix.runtime }}
          dry-run: 'true'
